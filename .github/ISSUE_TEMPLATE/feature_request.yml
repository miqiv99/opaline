name: Feature request
description: Suggest an improvement for Opaline
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Opaline do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds or other designs considered?
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Screenshots, examples, or related tools.
