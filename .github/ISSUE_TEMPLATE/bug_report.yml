name: Bug report
description: Report something that is broken in Opaline
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest steps that reproduce the issue.
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Opaline version, install/build method.
      placeholder: Windows 11, Opaline 0.1.0-alpha, unsigned release build
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Screenshots, logs, or anything else useful.
